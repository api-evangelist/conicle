aid: conicle
name: Conicle
description: >-
  Conicle is a Thai education-technology company founded in 2014 and headquartered in Bangkok
  that offers an all-in-one corporate learning platform (ConicleX) letting organizations build,
  assign, and track online courses, in-house training, and skill-development pathways for their
  employees. The cloud-based learning management system serves more than 50 leading enterprises —
  including Honda, Coca-Cola, Unilever, McDonald's, Sansiri, and The Mall — and over one million
  learners across the banking, retail, healthcare, energy, insurance, and consumer-product
  sectors. Conicle has raised Series A funding led by InVent (the corporate venture arm of Intouch
  Holdings), with backing from 500 Global and Stormbreaker Ventures. Conicle publishes a shared
  design-system web-components library used across its properties but does not currently expose a
  public developer API.
